# Virtual workspace root (uv). Each service owns its own pyproject.toml.
[tool.uv.workspace]
members = ["services/api"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "integration: requires a running PostgreSQL+TimescaleDB (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

